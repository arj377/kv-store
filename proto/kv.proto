syntax = "proto3";

message SetRequest {
  string key   = 1;
  string value = 2;
}

message SetResponse {
  bool   success = 1;
  string error   = 2;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool   success = 1;
  string value   = 2;
  string error   = 3;
}

message DelRequest {
  string key = 1;
}

message DelResponse {
  bool   success = 1;
  string error   = 2;
}

service KVService {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DelRequest) returns (DelResponse);
}